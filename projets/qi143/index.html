

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>「MÀU」INST. – Playa d'Antarctica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
<a href="../../" class="banner-link">
  <img src="../../banner.png" alt="Playa d'Antarctica" class="banner">
</a>    
    <h1>「MÀU」INST.</h1>

    <div class="tracks">

      <!-- PROMESSES -->
      <div class="track">
        <div class="track-cover" onclick="openVideo('QAEz0lURVxU')" title="Lire la vidéo">
          <img src="cover-promesses.jpg" alt="Promesses">
        </div>
        <div class="track-info">
          <p class="track-title">Promesses | 103.1 BPM</p>
          <audio controls src="promesses.mp3"></audio>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal vidéo -->
  <div id="video-modal" class="modal" onclick="closeVideo(event)">
    <div class="modal-content">
      <span class="close" onclick="closeVideo(event)">&times;</span>
      <div id="video-container"></div>
    </div>
  </div>

  <script>
    function openVideo(id) {
      const modal = document.getElementById('video-modal');
      const container = document.getElementById('video-container');

      container.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
      modal.style.display = 'flex';
    }

    function closeVideo(event) {
      if (event.target.id === 'video-modal' || event.target.classList.contains('close')) {
        const modal = document.getElementById('video-modal');
        const container = document.getElementById('video-container');
        modal.style.display = 'none';
        container.innerHTML = '';
      }
    }
  </script>
</body>
</html>
