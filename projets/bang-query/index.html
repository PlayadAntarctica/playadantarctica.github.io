<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nom de l’album – Playa d'Antarctica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <a href="../../" class="banner-link">
      <img src="../../banner.png" alt="Playa d'Antarctica" class="banner">
    </a>

    <h1>!?</h1>
    <p class="subtitle">zéro</p>

    <div class="album">
      <img src="cover.jpg" alt="Pochette" class="album-cover">

      <div class="player">
        <p id="now-title">—</p>
        <audio id="audio" preload="metadata"></audio>

        <div class="controls">
          <button type="button" id="prev">⏮</button>
          <button type="button" id="play">▶</button>
          <button type="button" id="next">⏭</button>
        </div>

        <div class="seek">
          <span id="time">0:00</span>
          <input type="range" id="bar" min="0" max="100" value="0" step="0.1">
          <span id="duration">0:00</span>
        </div>
      </div>
    </div>

    <ol class="playlist" id="playlist"></ol>
  </div>

  <script>
const tracks = [
  { title: "Test 1ntro", file: "01 - Test 1ntro.mp3" },
  { title: "Playad", file: "02 - Playad.mp3" },
  { title: "FMR", file: "03 - FMR.mp3" },
  { title: "3D", file: "04 - 3D.mp3" },
  { title: "No man soul", file: "05 - No man soul.mp3" },
  { title: "Skit fail", file: "06 - Skit fail.mp3" },
  { title: "Inst 7", file: "07 - Inst 7.mp3" },
  { title: "Split", file: "08 - Split.mp3" },
  { title: "Downdowndown", file: "09 - Downdowndown.mp3" },
  { title: "Highhighhigh", file: "10 - Highhighhigh.mp3" },
  { title: "Test 1 numéro 2", file: "11 - Test 1 numéro 2.mp3" },
  { title: "Un jour", file: "12 - Un jour.mp3" },
  { title: "Pitched dreams", file: "13 - Pitched dreams.mp3" },
  { title: "Where is my mind (Pixies cover)", file: "14 - Where is my mind (Pixies cover).mp3" },
  { title: "Narcotic (Liquido cover)", file: "15 - Narcotic (Liquido cover).mp3" },
  { title: "Kids (MGMT cover)", file: "16 - Kids (MGMT cover).mp3" }
];

    const audio = document.getElementById("audio");
    const list = document.getElementById("playlist");
    const nowTitle = document.getElementById("now-title");
    const playBtn = document.getElementById("play");
    const bar = document.getElementById("bar");
    const timeEl = document.getElementById("time");
    const durEl = document.getElementById("duration");
    let index = 0;
    let seeking = false;

    function fmt(s) {
      if (!isFinite(s)) return "0:00";
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60).toString().padStart(2, "0");
      return m + ":" + sec;
    }

    function load(i, autoplay) {
      index = i;
      audio.src = tracks[i].file;
      nowTitle.textContent = tracks[i].title;
      document.querySelectorAll(".playlist li").forEach((li, n) => {
        li.classList.toggle("active", n === i);
      });
      if (autoplay) audio.play();
    }

    tracks.forEach((t, i) => {
      const li = document.createElement("li");
      li.textContent = t.title;
      li.addEventListener("click", () => load(i, true));
      list.appendChild(li);
    });

    playBtn.addEventListener("click", () => {
      if (!audio.src) load(0, true);
      else if (audio.paused) audio.play();
      else audio.pause();
    });

    document.getElementById("prev").addEventListener("click", () => {
      load((index - 1 + tracks.length) % tracks.length, true);
    });

    document.getElementById("next").addEventListener("click", () => {
      load((index + 1) % tracks.length, true);
    });

    audio.addEventListener("play", () => { playBtn.textContent = "⏸"; });
    audio.addEventListener("pause", () => { playBtn.textContent = "▶"; });

    audio.addEventListener("ended", () => {
      if (index < tracks.length - 1) load(index + 1, true);
      else playBtn.textContent = "▶";
    });

    audio.addEventListener("timeupdate", () => {
      if (!seeking && audio.duration) {
        bar.value = (audio.currentTime / audio.duration) * 100;
      }
      timeEl.textContent = fmt(audio.currentTime);
    });

    audio.addEventListener("loadedmetadata", () => {
      durEl.textContent = fmt(audio.duration);
    });

    bar.addEventListener("input", () => { seeking = true; });
    bar.addEventListener("change", () => {
      if (audio.duration) audio.currentTime = (bar.value / 100) * audio.duration;
      seeking = false;
    });

    load(0, false);
  </script>

  <p><center> !? (bang-query) - 01/10/2026</center></p>
</body>
</html>
