<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accès restreint – Playa d'Antarctica</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <!-- Formulaire mot de passe -->
    <div id="login">
      <h1>Accès restreint</h1>
      <p class="subtitle">Entrez le mot de passe</p>
      <input type="password" id="password" placeholder="Mot de passe" autocomplete="off">
      <button onclick="checkPassword()">Entrer</button>
      <p id="error" class="error"></p>
    </div>

    <!-- Contenu protégé (caché par défaut) -->
    <div id="content" style="display: none;">
      <a href="../../" class="banner-link">
        <img src="../../banner.png" alt="Playa d'Antarctica" class="banner">
      </a>
      
      <h1>「PRIVÉ」</h1>
      <p class="subtitle">Albums</p>

      <div class="albums">
        <!-- Tu ajouteras tes embeds Bandcamp ici -->
        <!-- Exemple :
        <div class="album">
          <iframe style="border: 0; width: 100%; height: 120px;" src="https://bandcamp.com/EmbeddedPlayer/album=XXXXX/size=large/bgcol=333333/linkcol=0f91ff/tracklist=false/artwork=small/transparent=true/" seamless></iframe>
        </div>
        -->
      </div>
    </div>

  </div>

  <script>
    function checkPassword() {
      const input = document.getElementById('password').value;
      const error = document.getElementById('error');

      if (input === '42011') {
        document.getElementById('login').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        // Optionnel : se souvenir pendant la session
        sessionStorage.setItem('auth', 'ok');
      } else {
        error.textContent = 'Mot de passe incorrect';
      }
    }

    // Si déjà connecté dans la session
    if (sessionStorage.getItem('auth') === 'ok') {
      document.getElementById('login').style.display = 'none';
      document.getElementById('content').style.display = 'block';
    }

    // Entrée avec la touche Entrée
    document.getElementById('password').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkPassword();
    });
  </script>
</body>
</html>
